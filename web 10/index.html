
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartForm - Registration & Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">SmartForm ✨</div>

        <h1>Welcome!</h1>
        <p class="subtitle">Create an account or sign in to continue.</p>

        <!-- Form Switch -->

        <div class="tabs">
            <button id="registerTab" class="active">Register</button>
            <button id="loginTab">Login</button>
        </div>

        <!-- Registration Form -->

        <form id="registerForm" novalidate>

            <h2>Create Account</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <small id="nameError"></small>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="text" id="regEmail" placeholder="Enter your email">
                <small id="regEmailError"></small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Enter password">
                <small id="regPasswordError"></small>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <small id="confirmError"></small>
            </div>

            <button type="submit" class="submit-btn">
                Create Account
            </button>

            <p id="registerMessage" class="message"></p>

        </form>

        <!-- Login Form -->

        <form id="loginForm" novalidate style="display:none;">

            <h2>Welcome Back</h2>

            <div class="form-group">
                <label>Email Address</label>
                <input type="text" id="loginEmail" placeholder="Enter your email">
                <small id="loginEmailError"></small>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password">
                <small id="loginPasswordError"></small>
            </div>

            <button type="submit" class="submit-btn">
                Login
            </button>

            <p id="loginMessage" class="message"></p>

        </form>

        <footer>
            Your information deserves protection 🔒
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
